<style>
  @font-face{
    font-family:'HaasGrotDisp'; font-style:normal; font-weight:450;
    src:url('Fonts/NeueHaasGrotDisp-45Light-Trial.otf') format('opentype');
  }
  @font-face{

  }
.gallery {
  column-count: 5;
  column-gap: 1rem;
}
.gallery > * {
  width: 100%;
  margin-bottom: 1rem;
  break-inside: avoid;
}
.gallery img {
  width: 100%;
  display: block;
  cursor: pointer;
}

h1 {
    font-family: 'HaasGrotDisp', sans-serif;
    font-weight: 650;
    font-size: 2.5rem;
    text-align: center;
    margin-bottom: 2rem;
}

.button {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;
  display: inline-flex;
  width: max-content;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 10px 20px;
  border: 1px solid #111;
  border-radius: 999px;
  color: #111;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  cursor: url('Character-building/hover-cursor.png'), pointer;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}

.button:hover {
  background: #111;
  color: #fff;
  transform: translateY(-2px);
}

.button:focus-visible {
  outline: 2px solid #18C6E7;
  outline-offset: 3px;
}

</style>
</head>

<!-- Lightbox HTML -->
<div id="lightbox" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; justify-content:center; align-items:center;" onclick="this.style.display='none'">
  <img id="lightbox-img" src="" style="max-width:90%; max-height:90%; border:3px solid white;">
</div>

<script>
// Lightbox Script
const items = document.querySelectorAll('.gallery img');
items.forEach(img => {
  img.onclick = () => {
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox').style.display = 'flex';
  }
});
</script>
